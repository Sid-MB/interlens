# Site config for interlens, built with Zensical (reads mkdocs.yml natively — no separate config needed).
#
# Design: the site is built from THREE sources with zero content duplication —
#   1. `docs/index.md`      → snippet-includes the top-level README (single source of truth for the intro).
#   2. `docs/examples/*.md` → the existing hand-written simple→advanced walkthrough, reused verbatim.
#   3. `docs/reference/**`  → the API reference: real, COMMITTED markdown written by
#                             `scripts/gen_ref_pages.py` from static analysis (griffe) of `src/` — one page
#                             per module, class, and module-level function, plus `symbols.json`. It used to
#                             be gitignored mkdocstrings `:::` stubs expanded at build time; the published
#                             docs moved to https://sidmb.com/docs/interlens, whose builder syncs this
#                             folder from git and renders plain markdown through Quarto/Pandoc, so neither
#                             gitignored files nor mkdocstrings directives could survive the trip. The
#                             script still splices the nav tree between the markers below (module index
#                             pages only — the ~700 symbol pages would drown the sidebar). Re-run it and
#                             commit the diff whenever the public API changes.
# The script also invokes `scripts/gen_llms_txt.py`, which emits `llms.txt` (index) and `llms-full.txt`
# (concatenated bodies) into `docs/` — Zensical copies them verbatim to the site root — replacing the
# mkdocs-llmstxt plugin, which Zensical doesn't run.
#
# Build: uv run --with griffe --no-project python scripts/gen_ref_pages.py && zensical build --clean
# Serve: uv run --with griffe --no-project python scripts/gen_ref_pages.py && zensical serve
site_name: interlens
site_description: A framework for scaffolding and interpreting multi-agent conversations (activation capture, steering, patching).
# site_url is the single source of truth for the published URL — gen_llms_txt.py reads it from here, and
# Zensical derives canonical links + sitemap entries from it. The site lives at the domain root, so the
# build output goes straight into `site/` (which vercel.ts serves as-is).
site_url: https://interlens.sidmb.com/
site_dir: site
repo_url: https://github.com/Sid-MB/interlens
repo_name: Sid-MB/interlens
edit_uri: edit/main/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

# No mkdocstrings handler any more: the reference is pre-rendered markdown, so there is nothing left to
# expand at build time. Its former options now live in `scripts/refgen/` — Google docstring style, table
# sections, `merge_init_into_class` (a class page's signature is its `__init__`), and the `!^_` private
# filter are all reimplemented there.
plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - toc: { permalink: true }

